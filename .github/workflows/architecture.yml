name: Architecture and DRY

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Prevent baseline growth
        if: github.event_name == 'pull_request'
        env:
          ARCHITECTURE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-baseline-growth.mjs
      - run: bun run test:architecture
